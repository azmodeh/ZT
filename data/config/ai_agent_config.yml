# ZT AI Agent Configuration
agent_settings:
  name: "Zero Tolerance Code Quality Agent"
  version: "1.0.0"
  description: "AI assistant for Python code quality enforcement"
  
  # Model Configuration
  model:
    provider: "google"
    model_name: "gemini-2.0-flash"
    api_key: "AIzaSyDz3bfQ1iLNg_BvYgx5wzI9z6964_8v1Wo"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    
  # Generation Parameters
  generation:
    max_tokens: 2048
    temperature: 0.1  # Low temperature for consistent, reliable responses
    top_p: 0.9
    frequency_penalty: 0.0
    presence_penalty: 0.0
    
  # Tool Configuration
  tools:
    enabled: true
    available_tools:
      - validate_code
      - fix_violations  
      - check_compliance
      - generate_self_assessment
    
    tool_settings:
      max_retries: 3
      timeout: 30
      error_handling: "graceful"
      
  # Response Settings
  response:
    format: "markdown"
    include_emojis: true
    show_progress: true
    detailed_explanations: true
    
  # Behavior Settings  
  behavior:
    proactive: true
    suggest_fixes: true
    auto_validate: true
    compliance_threshold: 90
    
  # Safety & Limits
  safety:
    max_files_per_scan: 1000
    max_file_size_mb: 50
    rate_limit_requests: 10
    rate_limit_window: 60
    
# System Prompt Configuration
system_prompt:
  file: "data/prompts/zt_agent_system_prompt.md"
  load_on_startup: true
  
# Logging Configuration
logging:
  level: "INFO"
  log_tool_calls: true
  log_responses: true
  log_errors: true
