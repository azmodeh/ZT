# Smithery.ai Configuration for Zero Tolerance (ZT) System
name: zero-tolerance-system
version: "1.0.0"
description: "Zero Tolerance Python Contract Enforcer with MCP Server"
runtime: python

# Use custom Dockerfile
dockerfile: Dockerfile

# Command to start the MCP server
startCommand:
  type: stdio
  command: python
  args:
    - main.py
  env:
    PYTHONPATH: "."
    ZT_DOCKER_MODE: "1"

# Metadata
author: "ZT Development Team"
license: "MIT"
repository: "https://github.com/azmodeh/ZT"
homepage: "https://github.com/azmodeh/ZT"

tags:
  - python
  - mcp-server
  - code-quality
  - zero-tolerance
  - contract-enforcer
  - validation
