main_max_lines: 4
no_print: true
type_hints_required: true
max_file_lines: 300
max_line_length: 79
no_hardcoded_values: true
absolute_imports_only: true
yaml_for_config: true
english_logs: true
persian_ui: true
modular_architecture: true
min_score: 90
auto_fix: true
max_passes: 3
target_root: "../app"
include_globs:
  - "**/*.py"
exclude_globs:
  - "enforcement/**"
  - "data/**"
  - "logs/**"
  - ".vscode/**"
  - "**/*.bak"
  - "**/__pycache__/**"
  - "venv/**"
  - ".venv/**"
