# Zero Tolerance Contract Rules Configuration
max_line_length:
  enabled: true
  limit: 120

no_print:
  enabled: true
  
no_hardcoded_values:
  enabled: true
  
max_file_length:
  enabled: true
  limit: 500
  
type_hints_required:
  enabled: true
  
max_complexity:
  enabled: true
  limit: 10
  
absolute_imports_only:
  enabled: false

# AI Configuration - Google Gemini
ai_config:
  api_key: "env:OPENROUTER_API_KEY"
  base_url: "https://openrouter.ai/api/v1"
  model: "meta-llama/llama-3.3-70b-instruct:free"
  system_prompt_file: "data/prompts/zt_agent_system_prompt.md"
  agent_config_file: "data/config/ai_agent_config.yml"
  temperature: 0.1
  max_tokens: 2048
target_root: "../app"
include_globs:
  - "**/*.py"
exclude_globs:
  - "enforcement/**"
  - "data/**"
  - "logs/**"
  - ".vscode/**"
  - "**/*.bak"
  - "**/__pycache__/**"
  - "venv/**"
  - ".venv/**"
