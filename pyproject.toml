[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-tolerance-system"
version = "1.0.0"
description = "Zero Tolerance Python Contract Enforcer with MCP Server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=0.9.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "requests>=2.28.0",
    "colorama>=0.4.0",
    "tqdm>=4.64.0",
    "radon>=5.1.0",
    "watchdog>=3.0.0",
]
